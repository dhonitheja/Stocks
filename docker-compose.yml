version: "3.9"

services:
  agent:
    build: .
    container_name: stocksage-agent
    restart: unless-stopped
    env_file: .env
    environment:
      TRADING_MODE: paper          # never override to live here
      LOG_FORMAT: json
      PYTHONUTF8: "1"
      DATABASE_URL: postgresql://stocksage:${POSTGRES_PASSWORD}@db:5432/stocksage
    volumes:
      - ./logs:/app/logs
      - ./stocksage.db:/app/stocksage.db   # SQLite fallback (paper mode)
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  api:
    build: .
    container_name: stocksage-api
    restart: unless-stopped
    env_file: .env
    environment:
      TRADING_MODE: paper
      LOG_FORMAT: json
      DATABASE_URL: postgresql://stocksage:${POSTGRES_PASSWORD}@db:5432/stocksage
    command: ["python", "scripts/start_api.py", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: stocksage-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stocksage
      POSTGRES_USER: stocksage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksage"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus metrics scraping
  prometheus:
    image: prom/prometheus:latest
    container_name: stocksage-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles: ["monitoring"]   # opt-in: docker compose --profile monitoring up

volumes:
  pgdata:
