[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "stocksage"
version = "1.0.0"
description = "Automated US equity trading agent"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["agent", "backtesting", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "T20", # flake8-print (no stray prints)
]
ignore = [
    "E501",  # line length — handled by formatter
    "S101",  # assert in tests is fine
    "S311",  # random for non-crypto use in order sizing is fine
    "B008",  # FastAPI dependency injection pattern
    "T201",  # print in scripts
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]
"scripts/*" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "backtesting"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
files = ["agent", "backtesting"]
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
log_cli = false
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["agent", "backtesting"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
